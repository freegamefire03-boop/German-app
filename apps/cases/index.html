<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Quiz Hub — Theme Selector</title>
<link rel="manifest" href="../../manifest.json">
<meta name="theme-color" content="#0D0C14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Deutsch">
<link rel="apple-touch-icon" href="../../assets/icons/icon-192.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body class="landing-body">
<div class="container landing">

  <div class="header">
    <div style="display:flex;align-items:center;gap:10px">
      <a href="../../index.html" class="header-icon" title="Home" style="text-decoration:none;font-size:1.4rem">🏠</a>
      <div>
        <h1 class="title">Quiz Hub</h1>
        <p class="subtitle">Choose a theme or create your own</p>
      </div>
    </div>
  </div>

  <div class="theme-grid" id="themeGrid"></div>

  <button class="create-btn" id="createBtn">＋ Create New Theme</button>

  <div class="modal-overlay" id="createModalOverlay"></div>

  <div class="modal" id="createModal">
    <div class="modal-header">
      <span class="modal-title">Create New Theme</span>
      <button class="modal-close" id="closeModalBtn">&times;</button>
    </div>
    <form id="createForm">
      <label class="form-lbl">Theme Name *</label>
      <input class="form-input" id="newName" type="text" placeholder="e.g. German Prepositions" required inputmode="text">

      <label class="form-lbl">Description</label>
      <input class="form-input" id="newDesc" type="text" placeholder="Brief description of the quiz" inputmode="text">

      <label class="form-lbl">Icon (emoji)</label>
      <input class="form-input" id="newIcon" type="text" placeholder="🇩🇪" maxlength="4" inputmode="text">

      <label class="form-lbl">Answer Options (comma separated)</label>
      <input class="form-input" id="newArticles" type="text" placeholder="e.g. der, die, das, den, dem, des" inputmode="text">

      <div class="form-error" id="createError"></div>

      <button class="form-submit" type="submit">Create Theme</button>
    </form>
  </div>

</div>

<script src="js/landing.js"></script>
</body>
</html>
